name: Continuous Integration

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore backend/SMR.sln

      - name: Roslyn Format Check
        run: dotnet format backend/SMR.sln --verify-no-changes

      - name: Build Backend (Warnings as Errors)
        run: dotnet build backend/SMR.sln --configuration Release /p:TreatWarningsAsErrors=true

      - name: Run Backend Integration Tests
        run: dotnet test backend/SMR.sln --configuration Release --no-build

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Linting Checks
        run: |
          cd frontend
          npm run lint

      - name: TypeScript Compile Check
        run: |
          cd frontend
          npm run build

  e2e-ci:
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: CI_StrongPass0rd!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CI_StrongPass0rd!' -Q 'SELECT 1' -C"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=SMR;User Id=sa;Password=CI_StrongPass0rd!;TrustServerCertificate=true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E Dependencies
        run: |
          cd e2e
          npm ci

      - name: Install Playwright Browsers
        run: |
          cd e2e
          npx playwright install --with-deps chromium

      - name: Run Playwright Smoke Tests
        run: |
          cd e2e
          npx playwright test
